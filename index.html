<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vote pour le prochain morceau</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .container {
                width: 100%;
                max-width: 500px;
                background: white;
                border-radius: 20px;
                padding: 30px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                text-align: center;
            }

            h2 {
                color: #333;
                margin-bottom: 10px;
                font-size: 28px;
            }

            .subtitle {
                color: #666;
                margin-bottom: 30px;
                font-size: 14px;
            }

            #songs {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            button {
                padding: 18px;
                font-size: 16px;
                font-weight: 600;
                border: 2px solid #667eea;
                background: white;
                color: #667eea;
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.3s ease;
                text-align: left;
                padding-left: 20px;
            }

            button:hover:not(:disabled) {
                background: #667eea;
                color: white;
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            }

            button:active:not(:disabled) {
                transform: translateY(0);
            }

            button:disabled {
                background: #10b981;
                color: white;
                border-color: #10b981;
                cursor: not-allowed;
                opacity: 0.8;
            }

            .loading {
                color: #667eea;
                font-size: 16px;
                padding: 20px;
            }

            .error {
                color: #ef4444;
                background: #fee2e2;
                padding: 15px;
                border-radius: 8px;
                margin-top: 20px;
            }

            .name-card {
                background: #f5f3ff;
                border: 2px solid #c7d2fe;
                border-radius: 14px;
                padding: 20px;
                margin-bottom: 24px;
                text-align: left;
            }

            .name-card label {
                display: block;
                font-size: 14px;
                font-weight: 600;
                color: #4338ca;
                margin-bottom: 10px;
            }

            .name-row {
                display: flex;
                gap: 10px;
            }

            .name-row input {
                flex: 1;
                padding: 14px;
                font-size: 16px;
                border: 2px solid #c7d2fe;
                border-radius: 10px;
                outline: none;
                color: #1e1b4b;
            }

            .name-row input:focus {
                border-color: #667eea;
            }

            .name-row button {
                padding: 14px 18px;
                font-size: 15px;
                border: none;
                background: #667eea;
                color: #fff;
                border-radius: 10px;
                cursor: pointer;
                text-align: center;
            }

            .name-row button:hover {
                background: #5568d3;
            }

            .greeting {
                font-size: 15px;
                color: #4338ca;
                font-weight: 600;
            }

            .greeting button {
                margin-top: 10px;
                padding: 8px 14px;
                font-size: 13px;
                border: 1px solid #c7d2fe;
                background: #fff;
                color: #4338ca;
                border-radius: 8px;
                cursor: pointer;
                text-align: center;
                font-weight: 600;
            }

            .hidden {
                display: none !important;
            }

            /* Live banner */
            .live-banner {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 12px 18px;
                border-radius: 12px;
                margin-bottom: 20px;
                font-size: 14px;
                font-weight: 600;
            }

            .live-banner .live-dot {
                width: 8px;
                height: 8px;
                background: #10b981;
                border-radius: 50%;
                display: inline-block;
                margin-right: 8px;
                animation: pulse-dot 2s infinite;
            }

            .live-banner .presence {
                font-size: 13px;
                opacity: 0.9;
            }

            @keyframes pulse-dot {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.4;
                }
            }

            .category {
                margin-bottom: 14px;
            }

            .category-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 20px;
                font-size: 17px;
                font-weight: 700;
                color: #4338ca;
                background: #f5f3ff;
                border: 2px solid #c7d2fe;
                border-radius: 12px;
                cursor: pointer;
                user-select: none;
                transition: background 0.2s;
            }

            .category-header:hover {
                background: #ede9fe;
            }

            .category-header .arrow {
                transition: transform 0.3s;
                font-size: 14px;
            }

            .category.open .category-header .arrow {
                transform: rotate(90deg);
            }

            .category-songs {
                display: none;
                flex-direction: column;
                gap: 10px;
                margin-top: 10px;
                padding-left: 6px;
            }

            .category.open .category-songs {
                display: flex;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>🎵 Vote</h2>
            <p class="subtitle">Quel morceau veux-tu entendre ?</p>

            <!-- Live banner: compteur + présence -->
            <div class="live-banner">
                <div>
                    <span class="live-dot"></span>
                    <span id="live-votes">0</span> votes en direct
                </div>
                <div class="presence">
                    👥 <span id="presence-count">1</span> connecté(s)
                </div>
            </div>

            <div class="name-card" id="name-card">
                <div id="name-form">
                    <label for="first-name"
                        >Ton prénom (obligatoire pour voter 🎤)</label
                    >
                    <div class="name-row">
                        <input
                            id="first-name"
                            type="text"
                            placeholder="Ex : Camille"
                            autocomplete="given-name"
                            maxlength="40"
                        />
                        <button id="save-name" type="button">OK</button>
                    </div>
                </div>
                <div id="name-greeting" class="greeting hidden">
                    <span id="greeting-text"></span>
                    <br />
                    <button id="edit-name" type="button">
                        Changer de prénom
                    </button>
                </div>
            </div>

            <div id="songs" class="loading">Chargement des morceaux...</div>
            <p id="vote-info" class="subtitle" style="margin-top: 16px"></p>
        </div>
        <script type="module">
            import { supabase } from "./supabase.js";

            let allButtons = [];
            let firstName = localStorage.getItem("voter_first_name") || "";
            let hasVoted = localStorage.getItem("has_voted") === "true";

            // Identifiant stable par appareil (ne change pas entre les tours)
            function getDeviceId() {
                let id = localStorage.getItem("device_id");
                if (!id) {
                    id =
                        (crypto.randomUUID && crypto.randomUUID()) ||
                        "dev-" +
                            Date.now() +
                            "-" +
                            Math.random().toString(16).slice(2);
                    localStorage.setItem("device_id", id);
                }
                return id;
            }
            const deviceId = getDeviceId();

            const nameForm = document.getElementById("name-form");
            const nameGreeting = document.getElementById("name-greeting");
            const greetingText = document.getElementById("greeting-text");
            const firstNameInput = document.getElementById("first-name");

            function showGreeting() {
                greetingText.innerText = `Salut ${firstName} 👋 ton prénom s'affichera sur le live.`;
                nameForm.classList.add("hidden");
                nameGreeting.classList.remove("hidden");
                unlockSongButtons();
            }

            function unlockSongButtons() {
                if (!hasVoted) {
                    allButtons.forEach((b) => (b.disabled = false));
                    const info = document.getElementById("vote-info");
                    if (info && info.innerText.includes("prénom"))
                        info.innerText = "";
                }
            }

            function lockAllButtons(message) {
                allButtons.forEach((b) => (b.disabled = true));
                const info = document.getElementById("vote-info");
                if (info) info.innerText = message;
            }

            function lockSongButtonsForName() {
                allButtons.forEach((b) => (b.disabled = true));
                const info = document.getElementById("vote-info");
                if (info)
                    info.innerText = "⬆️ Indique ton prénom pour pouvoir voter";
            }

            function showNameForm() {
                firstName = "";
                localStorage.removeItem("voter_first_name");
                firstNameInput.value = "";
                nameForm.classList.remove("hidden");
                nameGreeting.classList.add("hidden");
                lockSongButtonsForName();
                firstNameInput.focus();
            }

            async function saveFirstName() {
                const value = firstNameInput.value.trim();
                if (!value) {
                    firstNameInput.focus();
                    return;
                }
                firstName = value;
                localStorage.setItem("voter_first_name", firstName);
                showGreeting();
                try {
                    await supabase.from("voters").upsert(
                        {
                            device_id: deviceId,
                            first_name: firstName,
                            updated_at: new Date().toISOString(),
                        },
                        { onConflict: "device_id" },
                    );
                } catch (err) {
                    console.warn("Prénom non synchronisé:", err);
                }
            }

            document.getElementById("save-name").onclick = saveFirstName;
            document.getElementById("edit-name").onclick = showNameForm;
            firstNameInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") saveFirstName();
            });

            // Le prénom survit aux nouveaux tours
            if (firstName) showGreeting();

            async function loadSongs() {
                try {
                    // Si les votes ont été réinitialisés, on déverrouille le votant
                    const { count } = await supabase
                        .from("votes")
                        .select("*", { count: "exact", head: true });
                    if (count === 0 && hasVoted) {
                        hasVoted = false;
                        localStorage.removeItem("has_voted");
                    }

                    const { data, error } = await supabase
                        .from("songs")
                        .select("*")
                        .order("created_at", { ascending: true });
                    if (error) throw error;

                    const container = document.getElementById("songs");
                    container.innerHTML = "";

                    if (!data || data.length === 0) {
                        container.innerHTML =
                            '<div class="error">Aucun morceau disponible</div>';
                        return;
                    }

                    // Grouper par catégorie
                    const groups = {};
                    data.forEach((song) => {
                        const cat = song.category || "Autres";
                        if (!groups[cat]) groups[cat] = [];
                        groups[cat].push(song);
                    });

                    Object.keys(groups).forEach((catName) => {
                        const section = document.createElement("div");
                        section.className = "category";

                        const header = document.createElement("div");
                        header.className = "category-header";
                        header.innerHTML = `<span>${catName}</span><span class="arrow">▶</span>`;
                        header.onclick = () => section.classList.toggle("open");
                        section.appendChild(header);

                        const songList = document.createElement("div");
                        songList.className = "category-songs";

                        groups[catName].forEach((song) => {
                            const btn = document.createElement("button");
                            btn.innerText = `${song.title} - ${song.artist}`;
                            btn.dataset.songId = String(song.id);
                            allButtons.push(btn);

                            // Masquer si déjà joué
                            if (song.played) {
                                btn.style.display = "none";
                            }

                            btn.onclick = async () => {
                                if (!firstName) {
                                    alert(
                                        "Indique ton prénom avant de voter 🎤",
                                    );
                                    firstNameInput.focus();
                                    return;
                                }
                                if (hasVoted) {
                                    alert(
                                        "Tu as déjà voté ! Attends la prochaine session 🎵",
                                    );
                                    return;
                                }
                                try {
                                    await supabase.from("voters").upsert(
                                        {
                                            device_id: deviceId,
                                            first_name: firstName,
                                            updated_at:
                                                new Date().toISOString(),
                                        },
                                        { onConflict: "device_id" },
                                    );
                                    await supabase.from("votes").insert([
                                        {
                                            song_id: song.id,
                                            device_id: deviceId,
                                        },
                                    ]);
                                    hasVoted = true;
                                    localStorage.setItem("has_voted", "true");
                                    lockAllButtons(
                                        "✅ Merci pour ton vote ! Attends la prochaine session 🎵",
                                    );
                                } catch (err) {
                                    console.error("Erreur vote:", err);
                                    alert("Erreur lors du vote. Réessaye.");
                                }
                            };
                            songList.appendChild(btn);
                        });

                        section.appendChild(songList);
                        container.appendChild(section);
                    });

                    if (hasVoted) {
                        lockAllButtons(
                            "✅ Déjà voté ! Attends la prochaine session 🎵",
                        );
                    } else if (!firstName) {
                        lockSongButtonsForName();
                    }
                } catch (err) {
                    console.error("Erreur chargement:", err);
                    const container = document.getElementById("songs");
                    container.innerHTML =
                        '<div class="error">Erreur de connexion. Réessaye.</div>';
                }
            }

            (async () => {
                await loadSongs();

                // — Compteur live de votes —
                const { count: initialCount } = await supabase
                    .from("votes")
                    .select("*", { count: "exact", head: true });
                document.getElementById("live-votes").innerText =
                    initialCount || 0;

                // — Realtime: votes (compteur live + déverrouillage nouveau tour) —
                supabase
                    .channel("voter-realtime")
                    .on(
                        "postgres_changes",
                        { event: "*", schema: "public", table: "votes" },
                        async () => {
                            const { count } = await supabase
                                .from("votes")
                                .select("*", { count: "exact", head: true });
                            document.getElementById("live-votes").innerText =
                                count || 0;

                            // Si votes = 0, un nouveau tour a commencé
                            if (count === 0 && hasVoted) {
                                hasVoted = false;
                                localStorage.removeItem("has_voted");
                                if (firstName) unlockSongButtons();
                                document.getElementById("vote-info").innerText =
                                    "🔄 Nouveau tour ! Tu peux re-voter 🎉";
                            }
                        },
                    )
                    .on(
                        "postgres_changes",
                        { event: "UPDATE", schema: "public", table: "songs" },
                        (payload) => {
                            // — Played sync: masquer les morceaux joués —
                            const song = payload.new;
                            if (song.played) {
                                // Masquer le bouton du morceau joué
                                allButtons.forEach((btn) => {
                                    if (
                                        btn.dataset.songId === String(song.id)
                                    ) {
                                        btn.style.display = "none";
                                    }
                                });
                            } else {
                                // Ré-afficher si "un-played"
                                allButtons.forEach((btn) => {
                                    if (
                                        btn.dataset.songId === String(song.id)
                                    ) {
                                        btn.style.display = "";
                                    }
                                });
                            }
                        },
                    )
                    .subscribe();

                // — Présence: combien de personnes ont la page ouverte —
                const presenceChannel = supabase.channel("online-voters", {
                    config: { presence: { key: deviceId } },
                });

                presenceChannel
                    .on("presence", { event: "sync" }, () => {
                        const state = presenceChannel.presenceState();
                        const count = Object.keys(state).length;
                        document.getElementById("presence-count").innerText =
                            count;
                    })
                    .subscribe(async (status) => {
                        if (status === "SUBSCRIBED") {
                            await presenceChannel.track({
                                user: firstName || "Anonyme",
                                online_at: new Date().toISOString(),
                            });
                        }
                    });
            })();
        </script>
    </body>
</html>
